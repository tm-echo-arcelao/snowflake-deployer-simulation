name: Deploy (Non-Prod)

on:
  pull_request:
  workflow_dispatch:

jobs:
  deploy-non-prod:
    name: Run deployer in NON_PROD mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run deployer
        env:
          ENV: NON_PROD
        run: python src/deployer.py
